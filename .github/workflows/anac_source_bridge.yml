name: Preparar fuente ANAC

on:
  schedule:
    # 17:30 de Argentina, antes del DAG de Airflow de las 19:30.
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: anac-source-bridge
  cancel-in-progress: false

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar y validar fuente ANAC
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            --output anac_estadisticas.zip \
            "https://docs.anac.gob.ar/index.php/s/4ptegdXanm2rWJG/download"

          python - <<'PY'
          import zipfile

          path = "anac_estadisticas.zip"
          with zipfile.ZipFile(path) as archive:
              candidates = [
                  name
                  for name in archive.namelist()
                  if name.lower().endswith((".xlsx", ".xls"))
                  and "series-historicas" in name.lower()
                  and "2001-2022" not in name
              ]
              if not candidates:
                  raise SystemExit("El ZIP de ANAC no contiene la serie vigente esperada.")
              bad_member = archive.testzip()
              if bad_member:
                  raise SystemExit(f"El ZIP de ANAC está corrupto: {bad_member}")
              print(f"Fuente ANAC válida: {candidates[-1]}")
          PY

      - name: Copiar fuente a Donweb
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DONWEB_VPS_IP }}
          username: ${{ secrets.DONWEB_USER }}
          password: ${{ secrets.DONWEB_PASSWORD }}
          port: ${{ secrets.DONWEB_PORT }}
          source: anac_estadisticas.zip
          target: ${{ secrets.PATH_FOLDER_SAVE }}/automaticos/scrap_ANAC/files
          overwrite: true
